<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sales per Kelompok</title>
<meta name="theme-color" content="#4f46e5">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f5fb;--card:#fff;--ink:#14162b;--soft:#636782;--line:#e4e6f2;--pri:#4f46e5;--pri-s:#eef0ff;--ok:#10b981;--warn:#f59e0b;--bad:#ef4444;--f:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--sh:0 1px 2px rgba(20,22,43,.05),0 12px 28px -16px rgba(20,22,43,.22)}
@media(prefers-color-scheme:dark){:root{--bg:#0b0d1a;--card:#141729;--ink:#eceefc;--soft:#9a9fc0;--line:#252a45;--pri:#8b85ff;--pri-s:#1d2146;--sh:0 1px 2px rgba(0,0,0,.4),0 14px 30px -16px rgba(0,0,0,.7)}}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:1100px;margin:0 auto;padding:18px 16px 56px}
button,input{font:inherit;color:inherit}:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 16px}
h1{font-size:clamp(24px,4.5vw,34px);font-weight:800;letter-spacing:-.02em;margin:0}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12.5px;color:var(--soft)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 25%,transparent)}.dot.err{background:var(--bad);box-shadow:none}.dot.load{background:var(--warn);box-shadow:none}
.hero{margin-top:16px;padding:24px;border-radius:24px;color:#fff;background:linear-gradient(135deg,#4338ca,#6366f1 50%,#06b6d4);box-shadow:0 22px 44px -22px #4338ca}
.hero .l{opacity:.9;font-size:14px}.hero .big{font-size:clamp(32px,7vw,56px);font-weight:800;letter-spacing:-.03em;line-height:1.1;margin:4px 0 14px}
.stats{display:flex;flex-wrap:wrap;gap:10px}.stat{background:rgba(255,255,255,.16);border-radius:14px;padding:8px 14px}.stat b{display:block;font-size:18px}.stat span{font-size:12.5px;opacity:.9}
.ctl{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:end;margin:18px 0 6px}
.fld{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--soft)}
input[type=date],input[type=search]{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;min-height:40px;color:var(--ink)}
.btn{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 14px;min-height:40px;cursor:pointer;font-weight:600}.btn:hover{border-color:var(--pri)}
.btn.on{background:var(--pri);border-color:var(--pri);color:#fff}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:10px 0 6px;margin-top:6px;scrollbar-width:thin}
.tab{flex:none;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:9px 16px;cursor:pointer;font-weight:700;display:flex;align-items:center;gap:8px}
.tab i{width:10px;height:10px;border-radius:50%;background:var(--c,var(--pri))}.tab[aria-selected=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.note{background:color-mix(in srgb,var(--warn) 14%,var(--card));border:1px solid color-mix(in srgb,var(--warn) 45%,var(--line));border-radius:14px;padding:10px 14px;margin:10px 0;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--sh);margin-top:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:14px}
.g{background:var(--card);border:1px solid var(--line);border-top:5px solid var(--c);border-radius:20px;padding:16px;box-shadow:var(--sh);cursor:pointer;text-align:left;width:100%}
.g:hover{transform:translateY(-2px)}.g h3{margin:0;font-size:15px;color:var(--c)}.g .v{font-size:24px;font-weight:800;margin:6px 0 2px;letter-spacing:-.02em}.g .s{color:var(--soft);font-size:13px}
.pb{display:block;height:8px;background:var(--bg);border-radius:99px;overflow:hidden;margin:10px 0 4px}.pb i{display:block;height:100%;background:var(--c,var(--pri));border-radius:99px}
.go{color:var(--c);font-weight:700;font-size:13px;margin-top:8px;display:block}
h2{font-size:18px;font-weight:800;margin:0}.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 16px;margin-bottom:12px}.sub{color:var(--soft);font-size:13.5px}
.tw{overflow-x:auto;max-height:70vh;border:1px solid var(--line);border-radius:14px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{position:sticky;top:0;background:var(--card);font-size:12.5px;color:var(--soft);z-index:1}th.on{color:var(--pri)}tr:last-child td{border-bottom:0}
td.nm{white-space:normal;min-width:200px}.n{text-align:right;font-variant-numeric:tabular-nums}.rk{color:var(--soft);width:40px}
tr.zero td{color:var(--soft)}td.sh{min-width:120px}td.sh .pb{display:inline-block;width:70px;margin:0 8px 0 0;vertical-align:middle}td.sh b{font-size:12.5px;font-weight:600}
details.d{border-top:1px solid var(--line);padding:10px 0}details.d summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 12px;font-weight:700}
details.d summary::-webkit-details-marker{display:none}details.d summary::before{content:"▸ ";color:var(--soft)}details.d[open] summary::before{content:"▾ "}
details.d .tw{margin-top:10px;max-height:50vh}
.state{text-align:center;padding:34px 12px;color:var(--soft)}.state strong{display:block;color:var(--ink);font-size:17px;margin-bottom:6px}.state ol{text-align:left;display:inline-block;margin:10px 0 0;line-height:1.8}
code{background:var(--pri-s);padding:1px 6px;border-radius:6px;font-size:13px}
@media(max-width:600px){.hero{padding:18px;border-radius:20px}.stat b{font-size:16px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1>Sales per Kelompok</h1><span class="chip"><span class="dot load" id="dot"></span><span id="st">Memuat data…</span></span></div>
  <div id="notes"></div>
  <div id="app" hidden>
    <section class="hero"><div class="l" id="hL"></div><div class="big" id="hT"></div><div class="stats" id="stats"></div></section>
    <div class="ctl">
      <label class="fld">Dari tanggal<input type="date" id="dFrom"></label>
      <label class="fld">Sampai tanggal<input type="date" id="dTo"></label>
      <button class="btn" id="pLast" type="button">Tanggal terbaru</button>
      <button class="btn" id="p7" type="button">7 hari terakhir</button>
      <button class="btn" id="pAll" type="button">Semua tanggal</button>
    </div>
    <div class="tabs" id="tabs" role="tablist" aria-label="Kelompok"></div>
    <div id="body"></div>
  </div>
  <div class="card state" id="state"><strong>Memuat data…</strong>Mohon tunggu sebentar.</div>
</div>
<script>
/* ===== PENGATURAN: isi dua link CSV dari Google Sheets (File > Bagikan > Publikasikan ke web) ===== */
const MASTER_URL = "";   // link CSV untuk sheet MASTER
const DATA_URL   = "";   // link CSV untuk sheet DATA
const REFRESH_SECONDS = 120;
/* ================================================================================================= */

const $=id=>document.getElementById(id),pad=n=>String(n).padStart(2,"0");
const nfI=new Intl.NumberFormat("id-ID",{maximumFractionDigits:0}),nfQ=new Intl.NumberFormat("id-ID",{maximumFractionDigits:2});
const rp=n=>"Rp "+nfI.format(Math.round(n)),esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fd=i=>i.split("-").reverse().join("/"),COL=["#6366f1","#f97316","#10b981","#ec4899","#0ea5e9","#f59e0b"];
const S={groups:[],lives:[],from:null,to:null,touched:false,tab:"all",sort:"a",q:"",open:{},raw:"",sci:0,ok:false};
const bad=m=>Object.assign(new Error(m),{user:true});

/* ---------- baca CSV ---------- */
function parseCSV(t){
  const rows=[];let r=[],c="",q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch==='"')q=true;else if(ch===","){r.push(c);c=""}
    else if(ch==="\n"){r.push(c);rows.push(r);r=[];c=""}else if(ch!=="\r")c+=ch}
  if(c!==""||r.length){r.push(c);rows.push(r)}return rows;
}
const norm=v=>String(v==null?"":v).toLowerCase().replace(/\s+/g," ").trim();
const codeOf=v=>{const s=String(v==null?"":v).trim();return /^\d+(\.0+)?$/.test(s)?String(parseInt(s,10)):""};
function num(v){
  let s=String(v==null?"":v).trim().replace(/\s/g,"");if(!s)return 0;
  if(/e[+-]?\d+$/i.test(s)){S.sci++;return parseFloat(s.replace(",","."))||0}
  if(s.includes(",")&&s.includes("."))s=s.lastIndexOf(",")>s.lastIndexOf(".")?s.replace(/\./g,"").replace(",","."):s.replace(/,/g,"");
  else if(s.includes(","))s=/,\d{3}$/.test(s)?s.replace(/,/g,""):s.replace(",",".");
  else if(/^-?\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,"");
  const n=parseFloat(s);return isNaN(n)?0:n;
}
function toIso(v,dmy){
  const s=String(v==null?"":v).trim();let m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s);if(m)return m[0];
  m=/^(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(s);if(!m)return null;
  let a=+m[1],b=+m[2];if(dmy)[a,b]=[b,a];return m[3]+"-"+pad(a)+"-"+pad(b);
}
function parseMaster(rows){
  const h=rows.findIndex(r=>r.some(c=>norm(c)==="item name")&&r.some(c=>norm(c).startsWith("sales amount")));
  if(h<0)throw bad("Judul kolom (Item Name, Sales Amount) tidak ditemukan di sheet MASTER.");
  const head=rows[h].map(norm),cd=head.indexOf("date"),ci=head.indexOf("item"),cq=head.indexOf("sales qty"),ca=head.findIndex(x=>x.startsWith("sales amount"));
  if(cd<0)throw bad("Kolom Date tidak ditemukan di sheet MASTER.");
  const body=rows.slice(h+1),dmy=body.some(r=>{const m=/^(\d{1,2})\/\d{1,2}\/\d{4}/.exec(String(r[cd]).trim());return m&&+m[1]>12});
  const per={};
  for(const r of body){
    const c=codeOf(r[ci]),d=toIso(r[cd],dmy);if(!c||!d)continue;
    const mp=per[d]||(per[d]={}),x=mp[c]||(mp[c]={q:0,a:0});x.q+=num(r[cq]);x.a+=num(r[ca]);
  }
  return per;
}
function parseData(rows){
  const gs=[];let g=null;
  for(const r of rows){
    if(typeof r[0]==="string"&&/^sales\b/i.test(r[0].trim())&&!norm(r[1])){g={name:r[0].trim(),items:[]};gs.push(g);continue}
    if(!g)continue;const c=codeOf(r[0]);if(c&&String(r[1]||"").trim())g.items.push({code:c,name:String(r[1]).trim()});
  }
  if(!gs.length)throw bad("Sheet DATA tidak berisi kelompok (judul yang diawali SALES).");
  return gs;
}

/* ---------- ambil data ---------- */
async function get(url){
  const res=await fetch(url+(url.includes("?")?"&":"?")+"_="+Date.now(),{cache:"no-store"});
  if(!res.ok)throw bad("Google Sheets menjawab kode "+res.status+".");
  const t=await res.text();if(/^\s*<(!doctype|html)/i.test(t))throw bad("Link yang dipakai bukan link CSV hasil Publikasikan ke web.");
  return t;
}
async function load(){
  if(!https://docs.google.com/spreadsheets/d/e/2PACX-1vRQh2Pzo2aR-QS6M3zXKP_FrKzMcu1HQ0aFqcZ5KWFtRpZ-2crpZMumvbSaJpTQSTIBtbuiiu_gS-1T/pub?gid=0&single=true&output=csv||!https://docs.google.com/spreadsheets/d/e/2PACX-1vRQh2Pzo2aR-QS6M3zXKP_FrKzMcu1HQ0aFqcZ5KWFtRpZ-2crpZMumvbSaJpTQSTIBtbuiiu_gS-1T/pub?gid=1824438478&single=true&output=csv){setup();return}
  try{
    const [m,d]=await Promise.all([get(MASTER_URL),get(DATA_URL)]);
    if(m+d===S.raw&&S.ok){stat("ok");return}
    S.sci=0;const groups=parseData(parseCSV(d)),per=parseMaster(parseCSV(m));
    const dates=Object.keys(per).sort();if(!dates.length)throw bad("Belum ada baris bertanggal di sheet MASTER.");
    S.lives=dates.map(dt=>{const items={};groups.forEach(g=>g.items.forEach(it=>{const x=per[dt][it.code];items[it.code]=x?[Math.round(x.q*100)/100,Math.round(x.a)]:[0,0]}));return{to:dt,items}});
    S.groups=groups;S.raw=m+d;S.ok=true;
    if(S.tab!=="all"&&!groups.some(g=>g.name===S.tab))S.tab="all";
    $("state").hidden=true;$("app").hidden=false;stat("ok");render();
  }catch(e){
    stat("err");
    if(!S.ok){$("app").hidden=true;$("state").hidden=false;$("state").innerHTML="<strong>Data belum bisa dimuat</strong>"+esc(e.user?e.message:"Tidak bisa terhubung ke Google Sheets. Pastikan kedua sheet sudah dipublikasikan ke web dalam format CSV.")}
  }
}
function stat(k){
  $("dot").className="dot"+(k==="ok"?"":" "+k);
  $("st").textContent=k==="ok"?"Diperbarui "+new Date().toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"})+", otomatis tiap "+Math.round(REFRESH_SECONDS/60)+" menit":k==="err"?(S.ok?"Gagal memperbarui, menampilkan data terakhir":"Gagal memuat data"):"Memuat data…";
}
function setup(){
  stat("err");$("st").textContent="Belum diatur";$("app").hidden=true;$("state").hidden=false;
  $("state").innerHTML='<strong>Satu langkah lagi: hubungkan ke spreadsheet</strong><ol><li>Di Google Sheets: <b>File, Bagikan, Publikasikan ke web</b>.</li><li>Pilih sheet <b>MASTER</b>, format <b>CSV</b>, klik Publikasikan, salin link-nya.</li><li>Ulangi untuk sheet <b>DATA</b>.</li><li>Buka file <code>index.html</code>, tempel kedua link pada <code>MASTER_URL</code> dan <code>DATA_URL</code>, lalu simpan.</li></ol>';
}

/* ---------- hitung ---------- */
function view(){
  const lo=S.lives[0].to,hi=S.lives[S.lives.length-1].to;
  if(!S.touched){S.from=lo;S.to=hi}
  let a=S.from||lo,b=S.to||hi;if(a>b)[a,b]=[b,a];
  const sel=S.lives.filter(e=>e.to>=a&&e.to<=b),vals={};
  sel.forEach(e=>{for(const c in e.items){const v=vals[c]||(vals[c]=[0,0]);v[0]+=e.items[c][0];v[1]+=e.items[c][1]}});
  return{lo,hi,a,b,sel,vals};
}
function rowsOf(items,vals){
  const k=S.sort==="q"?0:1,o=1-k,q=S.q.trim().toLowerCase();
  return items.map(it=>{const x=vals[it.code]||[0,0];return{name:it.name,q:x[0],a:x[1]}}).filter(r=>!q||r.name.toLowerCase().includes(q))
    .sort((x,y)=>(y[k?"a":"q"]-x[k?"a":"q"])||(y[o?"a":"q"]-x[o?"a":"q"])||x.name.localeCompare(y.name));
}
const sum=(items,vals)=>items.reduce((t,it)=>{const x=vals[it.code]||[0,0];t.q+=x[0];t.a+=x[1];t.n+=x[1]>0||x[0]>0?1:0;return t},{q:0,a:0,n:0});
function tbl(rows,total){
  return'<div class="tw"><table><thead><tr><th>#</th><th>Item</th><th class="n'+(S.sort==="q"?" on":"")+'">Qty</th><th class="n'+(S.sort==="a"?" on":"")+'">Sales</th><th>Porsi</th></tr></thead><tbody>'+
  (rows.length?rows.map((r,i)=>'<tr class="'+(r.q||r.a?"":"zero")+'"><td class="rk">'+(i+1)+'</td><td class="nm">'+esc(r.name)+'</td><td class="n">'+nfQ.format(r.q)+'</td><td class="n">'+rp(r.a)+'</td><td class="sh"><span class="pb"><i style="width:'+(total?Math.max(0,r.a)/total*100:0)+'%"></i></span><b>'+(total?(r.a/total*100).toFixed(1).replace(".",","):"0")+"%</b></td></tr>").join(""):'<tr><td colspan="5" class="state">Tidak ada item yang cocok.</td></tr>')+"</tbody></table></div>";
}

/* ---------- tampilan ---------- */
function render(){
  if(!S.ok)return;
  const v=view(),tot=S.groups.map((g,i)=>({g,i,...sum(g.items,v.vals)})),A=tot.reduce((t,x)=>t+x.a,0),Q=tot.reduce((t,x)=>t+x.q,0),N=tot.reduce((t,x)=>t+x.n,0),all=S.groups.reduce((t,g)=>t+g.items.length,0);
  $("dFrom").min=$("dTo").min=v.lo;$("dFrom").max=$("dTo").max=v.hi;$("dFrom").value=v.a;$("dTo").value=v.b;
  $("pLast").classList.toggle("on",v.a===v.hi&&v.b===v.hi);$("pAll").classList.toggle("on",v.a===v.lo&&v.b===v.hi);
  $("notes").innerHTML=S.sci?'<div class="note">Ada '+S.sci+" angka di spreadsheet yang tertulis dalam format ilmiah (contoh 1.23E+05), sehingga bisa terbulatkan. Ubah format kolom Sales Qty dan Sales Amount menjadi Angka biasa agar akurat.</div>":"";
  $("hL").textContent="Total penjualan "+(v.a===v.b?"tanggal "+fd(v.a):fd(v.a)+" sampai "+fd(v.b));
  $("hT").textContent=rp(A);
  $("stats").innerHTML=[[nfQ.format(Q),"Qty terjual"],[v.sel.length,"Jumlah hari"],[N+" dari "+all,"Item terjual"]].map(s=>'<div class="stat"><b>'+s[0]+"</b><span>"+s[1]+"</span></div>").join("");
  const short=n=>n.replace(/^sales\s+/i,"");
  $("tabs").innerHTML='<button class="tab" role="tab" data-t="all" aria-selected="'+(S.tab==="all")+'">Ringkasan</button>'+S.groups.map((g,i)=>'<button class="tab" role="tab" style="--c:'+COL[i%COL.length]+'" data-t="'+esc(g.name)+'" aria-selected="'+(S.tab===g.name)+'"><i></i>'+esc(short(g.name))+"</button>").join("");
  if(!v.sel.length){$("body").innerHTML='<div class="card state"><strong>Tidak ada data pada tanggal ini</strong>Tanggal yang tersedia: '+fd(v.lo)+" sampai "+fd(v.hi)+".</div>";return}
  if(S.tab==="all"){
    $("body").innerHTML='<div class="grid">'+tot.map(x=>'<button class="g" type="button" data-t="'+esc(x.g.name)+'" style="--c:'+COL[x.i%COL.length]+'"><h3>'+esc(short(x.g.name))+'</h3><div class="v">'+rp(x.a)+'</div><div class="s">'+nfQ.format(x.q)+" qty, "+x.n+" dari "+x.g.items.length+' item terjual</div><span class="pb"><i style="width:'+(A?x.a/A*100:0)+'%"></i></span><div class="s">'+(A?(x.a/A*100).toFixed(1).replace(".",","):0)+'% dari total</div><span class="go">Lihat semua item →</span></button>').join("")+"</div>";
    return;
  }
  const x=tot.find(t=>t.g.name===S.tab);if(!x){S.tab="all";render();return}
  const rows=rowsOf(x.g.items,v.vals);
  let h='<section class="card" style="--c:'+COL[x.i%COL.length]+'"><div class="head"><div><h2>'+esc(short(x.g.name))+'</h2><div class="sub">'+rp(x.a)+" dari "+nfQ.format(x.q)+" qty, "+x.g.items.length+' item. Semua item ditampilkan.</div></div><div style="display:flex;gap:8px;flex-wrap:wrap"><input type="search" id="q" placeholder="Cari nama item" value="'+esc(S.q)+'" aria-label="Cari item"><button class="btn'+(S.sort==="a"?" on":"")+'" data-s="a" type="button">Urutkan Sales</button><button class="btn'+(S.sort==="q"?" on":"")+'" data-s="q" type="button">Urutkan Qty</button></div></div>'+tbl(rows,x.a)+"</section>";
  if(v.sel.length>1){
    h+='<section class="card"><div class="head"><div><h2>Rincian per tanggal</h2><div class="sub">Klik tanggal untuk melihat semua item hari itu.</div></div></div>'+v.sel.map(e=>{
      const s=sum(x.g.items,e.items),op=S.open[e.to]?" open":"";
      return'<details class="d" data-d="'+e.to+'"'+op+'><summary><span>'+fd(e.to)+'</span><span class="sub">'+rp(s.a)+", "+nfQ.format(s.q)+" qty</span></summary>"+(op?tbl(rowsOf(x.g.items,e.items),s.a):"")+"</details>";
    }).join("")+"</section>";
  }
  $("body").innerHTML=h;
  if(S.focusQ){const q=$("q");if(q){q.focus();q.setSelectionRange(q.value.length,q.value.length)}S.focusQ=false}
}

/* ---------- interaksi ---------- */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-t]");if(t){S.tab=t.dataset.t;S.q="";render();window.scrollTo({top:0,behavior:"smooth"});return}
  const s=e.target.closest("[data-s]");if(s){S.sort=s.dataset.s;render()}
});
document.addEventListener("input",e=>{if(e.target.id==="q"){S.q=e.target.value;S.focusQ=true;render()}});
document.addEventListener("toggle",e=>{
  const d=e.target;if(!d.dataset||!d.dataset.d)return;S.open[d.dataset.d]=d.open;
  if(d.open&&!d.querySelector(".tw")){const x=S.groups.find(g=>g.name===S.tab),l=S.lives.find(z=>z.to===d.dataset.d);if(x&&l){const s=sum(x.items,l.items);d.insertAdjacentHTML("beforeend",tbl(rowsOf(x.items,l.items),s.a))}}
},true);
const setRange=(a,b,t)=>{S.from=a;S.to=b;S.touched=t;render()};
$("dFrom").onchange=$("dTo").onchange=()=>setRange($("dFrom").value||null,$("dTo").value||null,true);
$("pLast").onclick=()=>{const h=S.lives[S.lives.length-1].to;setRange(h,h,true)};
$("pAll").onclick=()=>setRange(null,null,false);
$("p7").onclick=()=>{const h=S.lives[S.lives.length-1].to,d=new Date(h+"T00:00:00Z");d.setUTCDate(d.getUTCDate()-6);const a=d.toISOString().slice(0,10);setRange(a<S.lives[0].to?S.lives[0].to:a,h,true)};
load();setInterval(()=>{if(!document.hidden)load()},REFRESH_SECONDS*1000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)load()});
</script>
